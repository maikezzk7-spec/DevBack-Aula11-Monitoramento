name: Pipeline - Monitoramento de Maquinas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Compilar e testar projeto
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e executar testes
        run: mvn --batch-mode clean verify